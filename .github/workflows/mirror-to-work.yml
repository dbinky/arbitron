name: Mirror to work repo

# Publishes this repo's history to the downstream work repo
# (tapcheck-engineering/automation). Develop here; this pushes the result there.
#
# Runs automatically on every push to main, and can be triggered manually
# (Actions tab -> "Mirror to work repo" -> Run workflow, or `gh workflow run`).
#
# Requires repo secret WORK_REPO_PAT — a fine-grained PAT owned by the
# tapcheck-engineering org, scoped to the `automation` repo, with
# Contents: Read and write AND Workflows: Read and write (the repo contains
# .github/workflows files, which need the Workflows permission to push).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to mirror (pushed to the same branch on the work repo)
        type: string
        default: main

concurrency:
  group: mirror-to-work-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # Only the source repo mirrors; the copy that lands on the work repo is inert.
    if: github.repository == 'dbinky/arbitron'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: vars
        run: echo "branch=${{ github.event.inputs.branch || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.branch }}
          fetch-depth: 0 # full history — a shallow checkout cannot be pushed

      - name: Push to work repo
        env:
          WORK_PAT: ${{ secrets.WORK_REPO_PAT }}
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "${WORK_PAT:-}" ]; then
            echo "::warning::WORK_REPO_PAT secret is not set — skipping mirror. Add it under Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Mirroring ${BRANCH} -> tapcheck-engineering/automation:${BRANCH}"
          git push "https://x-access-token:${WORK_PAT}@github.com/tapcheck-engineering/automation.git" "HEAD:refs/heads/${BRANCH}"
          echo "Mirror complete."
