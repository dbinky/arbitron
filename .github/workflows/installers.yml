name: installers

# Lint + test the bash installer (install.sh, P1 local path). Runs shellcheck and
# the mocked bats suite under tests/install on both a Linux container (apt/dnf/
# systemd code paths) and a macOS runner (launchd/brew path). Everything is
# mocked — no network, no real package managers, no real services.
on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'tests/install/**'
      - 'tests/release/**'
      - 'Makefile'
      - 'cmd/arbitron/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/install/**'
      - '.github/workflows/installers.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'tests/install/**'
      - 'tests/release/**'
      - 'Makefile'
      - 'cmd/arbitron/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/install/**'
      - '.github/workflows/installers.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck + bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: make test-install
        run: make test-install

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck + bats
        run: brew install shellcheck bats-core

      - name: make test-install
        run: make test-install

  release-tests:
    # Verify artifact naming, SHA256SUMS self-consistency, version round-trip,
    # and docs URL accuracy. Requires Go to run `make dist`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: make test-release
        run: make test-release
