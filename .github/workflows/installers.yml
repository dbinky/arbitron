name: installers

# Lint + test the bash installer (install.sh, P1 local path). Runs shellcheck and
# the mocked bats suite under tests/install on both a Linux container (apt/dnf/
# systemd code paths) and a macOS runner (launchd/brew path). Everything is
# mocked — no network, no real package managers, no real services.
on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'tests/install/**'
      - 'Makefile'
      - '.github/workflows/installers.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'tests/install/**'
      - 'Makefile'
      - '.github/workflows/installers.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck + bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: make test-install
        run: make test-install

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck + bats
        run: brew install shellcheck bats-core

      - name: make test-install
        run: make test-install

  windows:
    # Lint + test the PowerShell installer (install.ps1, P3 Windows local path).
    # Runs Pester (mocked winget / Scheduled Task / downloads — no network, no
    # real package managers, no real service registration) plus the
    # PSScriptAnalyzer lint gate. Pinned Pester 5.x + PSScriptAnalyzer.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Invoke-Pester (install suite + lint gate)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/install'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.Should.ErrorAction = 'Stop'
          Invoke-Pester -Configuration $config
