name: layout

# One run per change: pushes only on main, every pull request unfiltered.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # test-render alone allows 90 minutes.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3
        with:
          chrome-version: stable
          install-dependencies: true

      # Ubuntu 24.04 runners restrict unprivileged user namespaces through
      # AppArmor, so Chrome falls back to an unconfigured SUID sandbox and
      # aborts. Lift the restriction instead of running without a sandbox.
      - name: Allow Chrome's user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # bubblewrap: the harden sandbox refuses to run repository code on Linux
      # without it, and its script tests exercise the real sandbox.
      - name: Install script-test tools
        run: sudo apt-get install -y shellcheck bats bubblewrap

      - name: Test all surfaces with a real browser
        env:
          ARBITRON_LAYOUT_BROWSERPATH: ${{ steps.chrome.outputs.chrome-path }}
        run: make test-gate

  # Bundled fonts must render identically inside the shipped image. Always on
  # main; on a pull request only when the renderer, the arranged graph, the
  # font scripts, the image or the dashboard lockfile change. The job itself
  # always runs, so it can be a required check.
  font-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect font-portability inputs
        id: fonts
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qE '^(adapter/renderreview/|dashboard/src/graph/arranged/|dashboard/scripts/|Dockerfile$|dashboard/package-lock\.json$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.fonts.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Docker Buildx
        if: steps.fonts.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build the shipped image
        if: steps.fonts.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          tags: arbitron:layout-render
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Font portability in the shipped image
        if: steps.fonts.outputs.changed == 'true'
        run: make test-font-portability FONT_IMAGE_BUILD=true
