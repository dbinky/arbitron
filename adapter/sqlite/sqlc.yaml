version: "2"
sql:
  - engine: "sqlite"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "generated"
        out: "generated"
        # Keep SQLite storage types until the pin decoder validates them.
        # Scanning into int64 would accept BLOB "0" as a legacy run.
        overrides:
          - column: "instances.model_pins_version"
            go_type: "interface{}"
        rename:
          llm_conversation: "LLMConversation"
          llm_model: "LLMModel"
          llm_tokens_in: "LLMTokensIn"
          llm_tokens_out: "LLMTokensOut"
          base_url: "BaseURL"
          api_key_cipher: "APIKeyCipher"
          api_key_nonce: "APIKeyNonce"
