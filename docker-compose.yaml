services:
  arbitron:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - arbitron-data:/data
      - ./workspaces:/workspaces
      - claude-config:/claude-config
      - gh-config:/home/arbitron/.config/gh
      # SECURITY: the sample workflows are seeded public-by-default now, so a
      # broad host mount is exposed to every run. We do NOT bind-mount the host's
      # entire ~/Repos by default — a prompt-injected or malicious-input run could
      # read/modify every repo under it. Repos cloned by the pr-review workflow
      # live in the container-managed workspace instead.
      #
      # OPT-IN: to make a specific host repo reachable at the same
      # ~/Repos/<owner>/<name> path the host uses, uncomment and narrow to the one
      # repo you need (add :ro where the workflow only reads it). Mounting all of
      # ${HOME}/Repos is an explicit, deliberate choice, not the default.
      # - ${HOME}/Repos/<owner>/<name>:/home/arbitron/Repos/<owner>/<name>
    environment:
      - ARBITRON_DATABASE_PATH=/data/arbitron.db
      - ARBITRON_WORKSPACE_PATH=/workspaces
      - ARBITRON_LOGGING_FILE=/data/arbitron.log
      - ARBITRON_SERVER_HOST=0.0.0.0
      - ARBITRON_SAMPLES_SEED=true
      - ARBITRON_SAMPLES_SOURCEDIR=/samples
      - ARBITRON_LLM_PROVIDER=claude-cli
      - ARBITRON_LLM_BINARYPATH=/usr/local/bin/claude
      # SECURITY: skip-permissions is a CRITICAL knob (see PR #8 security
      # thread 3291940088) — it grants the agent permission-free, unattended tool
      # execution (RCE-equivalent under hostile prompts). It defaults to FALSE
      # now that the sample workflows are seeded public-by-default: every
      # authenticated user could otherwise trigger service-account-privileged
      # execution out of the box. Set it to true ONLY for a single-tenant dev box
      # where you accept that posture; never in a multi-tenant deployment.
      - ARBITRON_LLM_SKIPPERMISSIONS=false
      # Persist claude's OAuth credentials in the claude-config named volume so
      # `claude /login` only has to be run once. CLAUDE_CONFIG_DIR is on the
      # subprocess env allowlist.
      - CLAUDE_CONFIG_DIR=/claude-config
      # SECURITY: keep Chromium's sandbox for layout review. The image's
      # ARBITRON_LAYOUT_BROWSERNOSANDBOX=true is only the bare `docker run`
      # fallback (Docker's default seccomp profile blocks the sandbox); this
      # deployment loads a seccomp profile that permits it (below).
      - ARBITRON_LAYOUT_BROWSERNOSANDBOX=false
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile plus clone/unshare/setns/chroot, which
      # Chromium's unprivileged namespace sandbox needs. See
      # docs/install/README.md "Browser for workflow auto-arrangement".
      - seccomp=./docker/seccomp-chromium.json
    restart: unless-stopped

volumes:
  arbitron-data:
  claude-config:
  gh-config:
